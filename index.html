/* ----------- STATE ----------- */
let S={step:0,a:{},ref:null};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
STEPS.forEach(st=>st.f.forEach(q=>{if(q.v!==undefined&&S.a[q.id]===undefined)S.a[q.id]=Array.isArray(q.v)?[...q.v]:q.v}));
if(!S.ref){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';S.ref='CSF-'+Array.from({length:4},()=>c[Math.floor(Math.random()*c.length)]).join('')}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));$('#saved').textContent='Enregistré ✓'}catch(e){}}
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TOTAL=STEPS.length+1; // + recap

function visible(q){
  if(!q.if)return true;const[k,v]=q.if,cur=S.a[k],vals=Array.isArray(v)?v:[v];
  return Array.isArray(cur)?cur.some(x=>vals.includes(x)):vals.includes(cur);
}
function filled(q){const v=S.a[q.id];if(q.type=='team')return Array.isArray(v)&&v.some(m=>m.prenom);return Array.isArray(v)?v.length>0:!!(v&&String(v).trim())}

/* ----------- RENDER ----------- */
function field(q){
  const v=S.a[q.id],name=q.id;
  let html=`<div class="q" data-q="${q.id}"><label class="t" for="f_${q.id}">${esc(q.l)}${q.req?'<span class="req">*</span>':''}</label>${q.h?`<span class="h">${esc(q.h)}</span>`:'<span class="h"></span>'}`;
  if(['text','email','tel','url'].includes(q.type))html+=`<input id="f_${q.id}" type="${q.type}" data-k="${q.id}" value="${esc(v||'')}" placeholder="${esc(q.ph||'')}">`;
  else if(q.type=='textarea')html+=`<textarea id="f_${q.id}" data-k="${q.id}" placeholder="${esc(q.ph||'')}">${esc(v||'')}</textarea>`;
  else if(q.type=='radio')html+=`<div class="opts">${q.o.map(o=>`<label class="opt"><input type="radio" name="${name}" data-k="${q.id}" value="${esc(o)}"${v==o?' checked':''}><span>${esc(o)}</span></label>`).join('')}</div>`;
  else if(q.type=='check')html+=`<div class="opts">${q.o.map(o=>`<label class="opt"><input type="checkbox" data-k="${q.id}" value="${esc(o)}"${(v||[]).includes(o)?' checked':''}><span>${esc(o)}</span></label>`).join('')}</div>${q.max?`<div class="count" id="c_${q.id}">${(v||[]).length} / ${q.max} sélectionnées</div>`:''}`;
  else if(q.type=='cards')html+=`<div class="opts cards">${q.o.map(([o,d])=>`<label class="opt"><input type="checkbox" data-k="${q.id}" value="${esc(o)}"${(v||[]).includes(o)?' checked':''}><span>${esc(o)}<em>${esc(d)}</em></span></label>`).join('')}</div>`;
  else if(q.type=='team'){const list=(v&&v.length)?v:[{}];html+=`<div id="team">${list.map((m,i)=>member(m,i)).join('')}</div><button class="add" type="button" id="addm">+ Ajouter une personne</button>`}
  return html+'</div>';
}
function member(m,i){return `<div class="member" data-i="${i}"><button type="button" class="rm" data-rm="${i}" aria-label="Retirer">✕</button>
 <input type="text" placeholder="Prénom" data-m="prenom" value="${esc(m.prenom||'')}">
 <input type="text" placeholder="Poste / rôle" data-m="poste" value="${esc(m.poste||'')}">
 <input type="text" class="full" placeholder="Sa voiture de rêve / sa passion auto" data-m="passion" value="${esc(m.passion||'')}">
 <input type="text" class="full" placeholder="Une phrase sur lui / elle" data-m="bio" value="${esc(m.bio||'')}"></div>`}

function render(){
  const app=$('#app');window.scrollTo({top:0});
  const pct=Math.round(S.step/(TOTAL-1)*100);$('#bar').style.width=pct+'%';
  const left=Math.max(0,Math.round((TOTAL-1-S.step)*0.8));
  $('#meta').innerHTML=S.step<TOTAL-1?`Étape ${S.step+1} / ${TOTAL-1}<br>≈ ${left||1} min restantes`:'Terminé';
  let dots=`<div class="steps">${Array.from({length:TOTAL},(_,i)=>`<button data-go="${i}" class="${i==S.step?'on':i<S.step?'done':''}" aria-label="Étape ${i+1}">${i==TOTAL-1?'✓':i+1}</button>`).join('')}</div>`;
  if(S.step==TOTAL-1){renderRecap(app,dots);return}
  const st=STEPS[S.step];
  let h=dots;
  if(st.welcome)h+=`<div class="hero-card"><div class="eyebrow"><span class="tri"><i></i><i></i><i></i></span>Clubsport France × Vseven</div>
    <h1>Construisons <b>votre site</b></h1>
    <p style="color:var(--mute)">Ce questionnaire prend environ 10 minutes. Il nous permet de créer un site qui vous ressemble vraiment : votre histoire, vos valeurs, vos services et votre façon de travailler.</p>
    <ul><li>Vos réponses sont enregistrées automatiquement sur cet appareil : vous pouvez faire une pause.</li><li>Les questions avec * sont obligatoires, tout le reste est facultatif.</li><li>À la fin, un bouton envoie le tout sur WhatsApp à Milan (Vseven Production).</li></ul></div>`;
  else h+=`<div class="eyebrow"><span class="tri"><i></i><i></i><i></i></span>${esc(st.t)}</div><h1>${esc(st.sub)}</h1><p class="intro">${esc(st.intro)}</p>`;
  if(st.admin)h+=`<div class="recap"><h3>Registre national des entreprises</h3><dl>${[['Raison sociale',ADMIN.raison],['Forme',ADMIN.forme],['SIREN',ADMIN.siren],['SIRET (siège)',ADMIN.siret],['N° TVA',ADMIN.tva],['Activité (NAF)',ADMIN.naf],['Siège',ADMIN.siege],['Président',ADMIN.president],['Date de création',ADMIN.creation]].map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl></div>`;
  h+=st.f.map(q=>visible(q)?field(q):`<div class="hide" data-q="${q.id}"></div>`).join('');
  app.innerHTML=h;
  $('#prev').disabled=S.step==0;$('#next').textContent=S.step==TOTAL-2?'Voir le récap →':'Suivant →';$('#navbar').classList.remove('hide');
}

/* ----------- EVENTS ----------- */
document.addEventListener('input',e=>{
  const t=e.target,k=t.dataset.k;
  if(t.dataset.m!==undefined){const box=t.closest('.member'),i=+box.dataset.i;S.a.equipe=S.a.equipe||[];S.a.equipe[i]=S.a.equipe[i]||{};S.a.equipe[i][t.dataset.m]=t.value;save();return}
  if(!k)return;
  const q=STEPS.flatMap(s=>s.f).find(x=>x.id==k);
  if(t.type=='checkbox'){
    let arr=S.a[k]||[];
    if(t.checked){if(q.max&&arr.length>=q.max){t.checked=false;toast(`${q.max} choix maximum`);return}arr=[...arr,t.value]}else arr=arr.filter(x=>x!=t.value);
    S.a[k]=arr;const c=$('#c_'+k);if(c)c.textContent=`${arr.length} / ${q.max} sélectionnées`;
  }else S.a[k]=t.value;
  t.closest('.q')?.classList.remove('err');
  save();
  if(t.type=='radio'||t.type=='checkbox'){ // conditional re-render without losing scroll
    const y=scrollY,st=STEPS[S.step];if(st&&st.f.some(x=>x.if&&x.if[0]==k)){render();scrollTo(0,y)}
  }
});
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){S.step=+g.dataset.go;save();render();return}
  if(e.target.id=='addm'){S.a.equipe=S.a.equipe||[{}];if(!S.a.equipe.length)S.a.equipe.push({});S.a.equipe.push({});save();const y=scrollY;render();scrollTo(0,y);return}
  const rm=e.target.dataset.rm;if(rm!==undefined){S.a.equipe=(S.a.equipe||[]).filter((_,i)=>i!=rm);save();const y=scrollY;render();scrollTo(0,y)}
});
$('#prev').onclick=()=>{if(S.step>0){S.step--;save();render()}};
$('#next').onclick=()=>{
  const st=STEPS[S.step];const miss=st.f.filter(q=>q.req&&visible(q)&&!filled(q));
  document.querySelectorAll('.q.err').forEach(x=>x.classList.remove('err'));
  if(miss.length){miss.forEach(q=>document.querySelector(`[data-q="${q.id}"]`)?.classList.add('err'));document.querySelector(`[data-q="${miss[0].id}"]`).scrollIntoView({behavior:'smooth',block:'center'});toast('Il manque une réponse obligatoire');return}
  S.step++;save();render();
};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._);t._=setTimeout(()=>t.classList.remove('show'),2200)}

/* ----------- RECAP + CODE ----------- */
function fmt(q){const v=S.a[q.id];if(q.type=='team')return (v||[]).filter(m=>m.prenom).map(m=>`${m.prenom}${m.poste?' — '+m.poste:''}${m.passion?' ('+m.passion+')':''}${m.bio?'\n  '+m.bio:''}`).join('\n');return Array.isArray(v)?v.join(', '):(v||'')}
function recapText(){
  let t=`QUESTIONNAIRE SITE — CLUBSPORT FRANCE\nRéf. ${S.ref}\n`;
  STEPS.forEach(st=>{const rows=st.f.filter(q=>visible(q)&&filled(q));if(!rows.length)return;t+=`\n■ ${st.t.toUpperCase()}\n`;rows.forEach(q=>t+=`• ${q.l} : ${fmt(q)}\n`)});
  return t;
}
async function makeCode(){
  const json=JSON.stringify({r:S.ref,a:S.a});
  const bytes=new TextEncoder().encode(json);
  let out=bytes,flag='1';
  try{if('CompressionStream' in window){const cs=new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'));out=new Uint8Array(await new Response(cs).arrayBuffer());flag='Z'}}catch(e){out=bytes;flag='1'}
  let bin='';out.forEach(b=>bin+=String.fromCharCode(b));
  return 'V7'+flag+btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
async function renderRecap(app,dots){
  $('#navbar').classList.add('hide');
  const code=await makeCode();
  const short=`Bonjour Milan 👋\nVoici le questionnaire du site Clubsport France.\nRéf. ${S.ref} — ${S.a.contact_nom||''}\n\n`;
  const full=short+recapText()+`\n— Code de sauvegarde —\n${code}`;
  let msg=full;
  if(encodeURIComponent(msg).length>7000)msg=short+`Priorité : ${S.a.priorite||'-'}\nOptions : ${(S.a.upsell||[]).join(', ')||'-'}\n\n(Récap complet dans le code ci-dessous)\n\n— Code —\n${code}`;
  const wa=`https://wa.me/${WA}?text=${encodeURIComponent(msg)}`;
  let h=dots+`<div class="eyebrow"><span class="tri"><i></i><i></i><i></i></span>Récapitulatif</div><h1>Merci, c'est <b>presque fini</b></h1>
  <p class="intro">Relisez vos réponses, puis envoyez-les à Milan sur WhatsApp. Votre code projet :</p>
  <div class="code">${S.ref}</div>
  <div class="actions"><a class="btn wa" href="${wa}" target="_blank" rel="noopener">Envoyer sur WhatsApp →</a><button class="btn" id="cp">Copier le récap</button><button class="btn" id="back">Modifier</button></div>
  <p class="note">Si WhatsApp ne s'ouvre pas : copiez le récap et envoyez-le au +41 78 269 12 67 (WhatsApp).</p><br>`;
  STEPS.forEach((st,i)=>{const rows=st.f.filter(q=>visible(q)&&filled(q));h+=`<div class="recap"><h3>${esc(st.t)}<button data-go="${i}">Modifier</button></h3>${rows.length?`<dl>${rows.map(q=>`<dt>${esc(q.l)}</dt><dd>${esc(fmt(q))}</dd>`).join('')}</dl>`:'<p class="note">Non renseigné</p>'}</div>`});
  h+=`<div class="actions"><a class="btn wa" href="${wa}" target="_blank" rel="noopener">Envoyer sur WhatsApp →</a></div>`;
  app.innerHTML=h;
  $('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(full);toast('Récap copié ✓')}catch(e){toast('Copie impossible : sélectionnez le texte')}};
  $('#back').onclick=()=>{S.step=TOTAL-2;save();render()};
}

/* ----------- DECODER (Milan) : ajoutez #decoder à l'URL ----------- */
async function decode(code){
  code=code.trim().replace(/\s+/g,'');if(!code.startsWith('V7'))throw 'Code invalide';
  const flag=code[2],b64=code.slice(3).replace(/-/g,'+').replace(/_/g,'/');
  const bin=atob(b64+'==='.slice((b64.length+3)%4));const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
  let out=bytes;if(flag=='Z'){const ds=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));out=new Uint8Array(await new Response(ds).arrayBuffer())}
  return JSON.parse(new TextDecoder().decode(out));
}
function renderDecoder(){
  $('#navbar').classList.add('hide');$('#bar').style.width='100%';$('#meta').textContent='Mode lecture';
  $('#app').innerHTML=`<div class="eyebrow"><span class="tri"><i></i><i></i><i></i></span>Vseven · Lecture</div><h1>Décoder un <b>questionnaire</b></h1><p class="intro">Collez le code reçu sur WhatsApp (il commence par V7).</p>
  <div class="q"><textarea id="dc" placeholder="V7Z…"></textarea><div class="actions"><button class="btn solid" id="dgo">Décoder</button><button class="btn" id="dload">Charger dans le formulaire</button></div></div><div id="dout"></div>`;
  $('#dgo').onclick=async()=>{try{const d=await decode($('#dc').value);const keep=S;S={step:0,a:d.a,ref:d.r};$('#dout').innerHTML=`<div class="code">${esc(d.r)}</div><div class="recap"><dl style="display:block"><dd>${esc(recapText())}</dd></dl></div>`;S=keep}catch(e){toast('Code invalide')}};
  $('#dload').onclick=async()=>{try{const d=await decode($('#dc').value);S={step:TOTAL-1,a:d.a,ref:d.r};save();location.hash='';render()}catch(e){toast('Code invalide')}};
}
function boot(){location.hash=='#decoder'?renderDecoder():render()}
addEventListener('hashchange',boot);boot();
</script>
